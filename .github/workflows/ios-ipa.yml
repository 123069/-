name: build-ios-ipa

# 在 macOS 上打包「清账」的未签名 IPA（不需要 Apple 开发者账号）。
# 产物用 Sideloadly / AltStore 在 Windows 上用自己的 Apple ID 重签后装进 iPhone。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 查看工具链
        run: |
          flutter --version
          xcodebuild -version

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 iOS（不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包成未签名 IPA
        run: |
          set -euo pipefail
          rm -rf Payload qingzhang-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry qingzhang-unsigned.ipa Payload
          rm -rf Payload
          ls -lh qingzhang-unsigned.ipa
          unzip -l qingzhang-unsigned.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: qingzhang-unsigned-ipa
          path: qingzhang-unsigned.ipa
          if-no-files-found: error
