workflows:
  ios-unsigned:
    name: 清账 · 未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Flutter 依赖
        script: |
          flutter --version
          flutter pub get
      - name: 构建 iOS（不签名）
        script: |
          flutter build ios --release --no-codesign
      - name: 打包成未签名 IPA
        script: |
          set -e
          mkdir -p build/ipa_payload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa_payload/Payload/
          cd build/ipa_payload
          zip -qry ../qingzhang-unsigned.ipa Payload
          cd ../..
          ls -lh build/qingzhang-unsigned.ipa
      # 把包提交回仓库，这样不用在网页上找下载按钮，本机可以直接取
      - name: 把 IPA 推回仓库
        script: |
          cp build/qingzhang-unsigned.ipa ./qingzhang-unsigned.ipa
          git config user.name "codemagic-bot"
          git config user.email "ci@codemagic.io"
          git add -f qingzhang-unsigned.ipa
          git commit -m "ci: attach unsigned ipa [skip ci]" || true
          git push origin HEAD:main || echo "push failed, use artifacts instead"
    artifacts:
      - build/qingzhang-unsigned.ipa
