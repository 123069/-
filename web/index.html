<head>

<meta charset="UTF-8">
<meta content="IE=Edge" http-equiv="X-UA-Compatible">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="清账 · 懒人记账：记一笔、看支出、控预算。">
<meta name="theme-color" content="#3B62F6">

<!-- iOS 装到主屏幕后全屏运行 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="清账">
<meta name="apple-mobile-web-app-title" content="清账">

<!-- Favicon -->
<link rel="icon" type="image/png" href="favicon.png"/>

<title>清账</title>
<link rel="manifest" href="manifest.json">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #F4F5F9;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: #8B92A3;
    font-size: 13px;
    background: #F4F5F9;
    z-index: 9;
  }
  #loading .dot {
    width: 34px; height: 34px; border-radius: 11px;
    background: linear-gradient(135deg, #3B62F6, #6C4CF1);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px; font-weight: 600;
  }
</style>
</head>
<body>
<div id="loading"><div class="dot">清</div><div>正在打开清账…</div></div>
<script src="flutter_bootstrap.js" async></script>
<script>
  window.addEventListener('flutter-first-frame', function () {
    var el = document.getElementById('loading');
    if (el) el.remove();
  });
</script>
</body>
</html>
